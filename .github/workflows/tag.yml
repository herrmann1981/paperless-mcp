name: Publish

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify release tag and install smoke-test dependencies
        run: |
          package_version="$(uv version --short)"
          test "$GITHUB_REF_NAME" = "v$package_version"
          uv sync --locked --group dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test MCP stdio initialization
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: uv run python scripts/smoke_docker_mcp.py "$IMAGE_REF"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Publish verified Docker image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            if [ -n "$image" ]; then
              docker push "$image"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Create source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive_name="${GITHUB_REPOSITORY##*/}-${TAG_NAME}.zip"
          git archive --format=zip --prefix="${GITHUB_REPOSITORY##*/}-${TAG_NAME}/" \
            --output="$archive_name" "$GITHUB_REF"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Create GitHub release and attach source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE_NAME" --generate-notes --verify-tag
