name: Publish

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive_name="${GITHUB_REPOSITORY##*/}-${TAG_NAME}.zip"
          git archive --format=zip --prefix="${GITHUB_REPOSITORY##*/}-${TAG_NAME}/" \
            --output="$archive_name" "$GITHUB_REF"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Create GitHub release and attach source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE_NAME" --generate-notes --verify-tag
