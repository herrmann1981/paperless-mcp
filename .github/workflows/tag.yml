name: Publish

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  issues: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify release tag and install smoke-test dependencies
        run: |
          package_version="$(uv version --short)"
          test "$GITHUB_REF_NAME" = "$package_version"
          uv sync --locked --group dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test MCP stdio initialization
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: uv run python scripts/smoke_docker_mcp.py "$IMAGE_REF"

      - name: Scan image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Publish verified Docker image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            if [ -n "$image" ]; then
              docker push "$image"
            fi
          done <<< "$IMAGE_TAGS"

      - name: Create source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive_name="${GITHUB_REPOSITORY##*/}-${TAG_NAME}.zip"
          git archive --format=zip --prefix="${GITHUB_REPOSITORY##*/}-${TAG_NAME}/" \
            --output="$archive_name" "$GITHUB_REF"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Generate release notes with closed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            previous_tag_epoch="$(git log -1 --format=%ct "$previous_tag")"
          else
            previous_tag_epoch=0
          fi
          previous_tag_date="$(date -u -d "@$previous_tag_epoch" '+%Y-%m-%dT%H:%M:%SZ')"

          api_args=(-f "tag_name=$TAG_NAME" -F "target_commitish=$GITHUB_SHA")
          if [ -n "$previous_tag" ]; then
            api_args+=(-f "previous_tag=$previous_tag")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${api_args[@]}" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"

          if closed_issue_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues" \
            -f state=closed \
            -f "since=$previous_tag_date" \
            -F per_page=100)"; then
            if jq -e 'type == "array" and all(.[]; type == "array" and all(.[]; type == "object"))' \
              <<< "$closed_issue_pages" > /dev/null; then
              jq -r --arg since "$previous_tag_date" '
                  (add // [])
                  | map(select(
                      .pull_request == null
                      and .closed_at >= $since
                    ))
                  | sort_by(.closed_at)
                  | if length == 0 then ""
                    else "\n\n## Closed issues\n\n" +
                      (map("- [#\(.number)](\(.html_url)) \(.title)") | join("\n"))
                    end
                ' <<< "$closed_issue_pages" >> "$RUNNER_TEMP/release-notes.md"
            else
              echo "::warning::GitHub returned an unexpected response while listing closed issues; creating release with generated pull request notes only."
            fi
          else
            echo "::warning::Could not list closed issues with GITHUB_TOKEN; creating release with generated pull request notes only."
          fi

      - name: Create GitHub release with generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh release create "$GITHUB_REF_NAME" "$ARCHIVE_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag; then
              exit 0
            fi

            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              echo "Release exists after create attempt; updating notes and archive."
              gh release edit "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" \
                --notes-file "$RUNNER_TEMP/release-notes.md"
              gh release upload "$GITHUB_REF_NAME" "$ARCHIVE_NAME" --clobber
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Release creation failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
              sleep "$delay"
            fi
          done

          echo "::error::Failed to create or reconcile the GitHub release after 3 attempts."
          exit 1
