[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-mcp"
version = "1.0.6"
description = "A FastMCP server for the Paperless-ngx API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
paperless-mcp = "paperless_mcp.server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_mcp"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker and a running Paperless-ngx test stack",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
