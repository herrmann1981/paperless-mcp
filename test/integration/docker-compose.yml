services:
  broker:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 3s
      retries: 20

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PAPERLESS_TEST_PORT:-8010}:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless-test-password
      PAPERLESS_SECRET_KEY: paperless-mcp-integration-test-secret-key-change-me
      PAPERLESS_URL: http://localhost:${PAPERLESS_TEST_PORT:-8010}
      PAPERLESS_ADMIN_USER: paperless-test-admin
      PAPERLESS_ADMIN_PASSWORD: paperless-test-password
      PAPERLESS_TIME_ZONE: UTC
